<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>大肥鱼</title>
<style>
  :root { --bg:#0f1220; --panel:#1a1f35; --me:#4f8cff; --her:#262c47; --text:#e8ecff; --muted:#8b93b8; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin:0; background:linear-gradient(180deg,#111427,#0b0e1a); color:var(--text); font-family:system-ui,-apple-system,"Microsoft YaHei",sans-serif; height:100dvh; display:flex; flex-direction:column; }
  header { padding:14px 16px 10px; display:flex; align-items:center; gap:10px; background:rgba(20,24,42,.9); backdrop-filter: blur(8px); border-bottom:1px solid #232a45; position:sticky; top:0; }
  header .dot { width:9px; height:9px; border-radius:50%; background:#39d98a; box-shadow:0 0 8px #39d98a; }
  header h1 { font-size:16px; margin:0; font-weight:600; }
  header .sub { font-size:12px; color:var(--muted); }
  #log { flex:1; overflow-y:auto; padding:16px; display:flex; flex-direction:column; gap:10px; }
  .row { display:flex; gap:8px; align-items:flex-end; }
  .row.me { justify-content:flex-end; }
  .bubble { max-width:76%; padding:10px 14px; border-radius:16px; font-size:15px; line-height:1.5; white-space:pre-wrap; word-break:break-word; }
  .me .bubble { background:var(--me); color:#fff; border-bottom-right-radius:6px; }
  .her .bubble { background:var(--her); border-bottom-left-radius:6px; }
  .bubble img { max-width:160px; border-radius:10px; display:block; }
  .bubble audio { margin-top:6px; width:200px; }
  .avatar { width:32px; height:32px; border-radius:50%; background:#2b3350 url('/sticker/好耶') center/cover; flex:none; }
  .typing { font-size:13px; color:var(--muted); padding:0 18px 8px; height:16px; }
  footer { padding:10px 12px calc(10px + env(safe-area-inset-bottom)); background:rgba(20,24,42,.95); border-top:1px solid #232a45; display:flex; gap:8px; align-items:center; }
  footer button, footer label { background:#2a3150; border:none; color:var(--text); width:42px; height:42px; border-radius:12px; font-size:18px; display:grid; place-items:center; cursor:pointer; }
  #input { flex:1; height:42px; border-radius:12px; border:1px solid #2c3350; background:#161a2e; color:var(--text); padding:0 12px; font-size:15px; outline:none; }
  #voiceBtn.on { background:#4f8cff; }
</style>
</head>
<body>
<header>
  <div class="dot"></div>
  <div>
    <h1>大肥鱼</h1>
    <div class="sub" id="status">在线</div>
  </div>
</header>
<div id="log"></div>
<div class="typing" id="typing"></div>
<footer>
  <label title="发图">🖼️<input id="file" type="file" accept="image/*" hidden></label>
  <input id="input" placeholder="跟她说点什么…" autocomplete="off">
  <button id="voiceBtn" title="语音回复">🔊</button>
  <button id="send" title="发送">➤</button>
</footer>
<script>
let ws, voice = false;
const log = document.getElementById('log');
const input = document.getElementById('input');
const typing = document.getElementById('typing');
const statusEl = document.getElementById('status');

function add(text, mine, sticker, audio) {
  const row = document.createElement('div');
  row.className = 'row ' + (mine ? 'me' : 'her');
  if (!mine) {
    const av = document.createElement('div');
    av.className = 'avatar';
    row.appendChild(av);
  }
  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  if (text) {
    const p = document.createElement('div');
    p.textContent = text;
    bubble.appendChild(p);
  }
  if (sticker) {
    const img = document.createElement('img');
    img.src = '/sticker/' + encodeURIComponent(sticker);
    bubble.appendChild(img);
  }
  if (audio) {
    const a = document.createElement('audio');
    a.controls = true;
    a.src = audio;
    bubble.appendChild(a);
  }
  row.appendChild(bubble);
  log.appendChild(row);
  log.scrollTop = log.scrollHeight;
}

function connect() {
  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  ws = new WebSocket(`${proto}://${location.host}/ws`);
  ws.onopen = () => { statusEl.textContent = '在线'; };
  ws.onclose = () => { statusEl.textContent = '断开了，重连中…'; setTimeout(connect, 2000); };
  ws.onerror = () => { statusEl.textContent = '连接错误'; };
  ws.onmessage = event => {
    const data = JSON.parse(event.data);
    typing.textContent = '';
    if (data.type === 'reply') add(data.text, false, data.sticker, data.audio);
    if (data.type === 'error') add('（出错了：' + data.message + '）', false);
  };
}

function send(text, image) {
  if (!ws || ws.readyState !== 1) return;
  add(text || '[图片]', true, null, null);
  typing.textContent = '她正在输入…';
  ws.send(JSON.stringify({ type: 'chat', text, image, voice }));
}

document.getElementById('send').onclick = () => { const v = input.value.trim(); if (!v) return; input.value = ''; send(v); };
input.addEventListener('keydown', e => { if (e.key === 'Enter') { const v = input.value.trim(); if (!v) return; input.value = ''; send(v); } });
document.getElementById('voiceBtn').onclick = e => { voice = !voice; e.currentTarget.classList.toggle('on', voice); };
document.getElementById('file').onchange = async e => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => send('', reader.result);
  reader.readAsDataURL(file);
  e.target.value = '';
};
async function loadHistory() {
  try {
    const res = await fetch('/history');
    const list = await res.json();
    for (const item of list.slice(-30)) add(item.content, item.role === 'user');
  } catch { }
}
loadHistory().then(connect);
</script>
</body>
</html>
